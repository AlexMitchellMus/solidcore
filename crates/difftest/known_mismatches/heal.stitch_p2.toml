case = "cov_cube2_do"
why = "5 values of the stitched B-rep's digest differ, edge/vertex tolerances raised by the region nesting's ray fire (first values.out[31]: C++ 3.118529526847857e-5 vs Rust 2.6188138958028285e-5); counts, topology and vertex points agree (plan/findings/heal.stitch_p2--region-nesting-ray-fire-raises-other-edge-tolerances.md)"

