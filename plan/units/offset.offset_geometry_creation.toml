notes = "PR #288 keeps the full creator API and its existing vertex algorithm; the new narrow VertexBackend delegates to that same implementation. Original vertex/tolerance reads and result edge/face geometry use typed cross-arena handles, with owned cap/curve outputs taken once. The numerical creators are not duplicated. The broader executive arena/SSI backend remains outside this vertex follow-up; #201 coordination retains that boundary. Main B-rep, face-domain and exact revolution import updates are preserved. Historical native evidence before this merge: 874 cases, 585 passed, 289 deferred, 0 rejected, 0 failed; max_rel_err=0.0, rel_tol=1e-09; no new absolute floors. partial; PR #307 after main ca3bbd2b: 874 cases, 585 compared passes, 289 deferred, 0 failed, max_rel_err=0, no absolute floors; sensitivity 585/585. The 28 curve.crv_on_surf rail deferrals on current main advance to topology.face_p2 owner/tolerance (41 current face_p2 deferrals), not guessed successes; aggregate pass/deferred counts match current main. Historical PR #307 after main 0a676a04: 861 cases, 552 compared passes, 309 deferred, sensitivity 552/552; 27 rail deferrals advanced to 40 face_p2 deferrals. Concrete-Surface rail integration (PR #307): real OffsetSurface-backed CrvOnSurf rails consume trimmed UV curves and native knot choices; former curve.crv_on_surf rail deferrals advance to topology.face_p2 owner/tolerance without substituting a default tolerance; box_edgeuse_offset_shell smoke reaches that dependency. No production offset-executive/SSI bridge or arbitrary returned offset B-rep is certified. HaveTangentGaps retains upstream unchecked NormalizedEvaluate with SM_UNDEF_DOUBLE. geom.tol cases query the trimmed surface cache of a face's own surface through surface_cache_p2 before the B-rep editing flag; batch #305 attributes object-tolerance overload to geom.tol. Face-tolerance caching is claimed by PR #301; non-plane analytic import remains a harness gap. Remaining analytic surface-kind dispatch is tracked in issue #76. Wired: surface.offset_surface (#62), offset.offset_executive_p1 GetCreateExtendedSurface through actual executive (#175), topology.edgeuse_p3 NormalizedEvaluate/CreateUVTrimCurve (#117). Both harnesses seed extended-surface cache with insert_extended_surface; no compared case runs CreateExtendedSurface (HANG-16, HANG-17). PR #147 owner-keeping surface-cache clone_for_evaluation is required; without it 5 cases fail. Guards: HANG-26 non-local FaceuseOffset on inexact analytic faces; HANG-27 EdgeuseOffset |dist|>1e6 (fuzz time budget, not termination boundary ~1e250); crash guards mirror shim and local pairs name store surfaces only. Historical PR #156 validation: 861 cases, 428 pass, 433 deferred; --seeds 4000: 4061 cases, 2114 pass, 0 fail, 1947 deferred; --fuzz 2000 FUZZ-PASS; green-par 213 units, 0 failed. Historical PR #149 after topology.brep_p2 back-edges wired: 861 cases, 542 pass, 319 deferred; SmBrep::Notify and MateLaminaEdgeToSurface account for former topology.brep_p2 deferrals. Historical revolution-lift/export follow-up: LiftCurve returns iso curves in their own kind (including SmLine/SmCircle); exact SmSurfOfRevolution faces export/read back as SurfOfRevolution records, and SmBSplineCurve exports retain type plus NURB. Inexact non-plane analytic imports remain harness:analytic-geometry-export deferrals; that historical run recorded 552 pass, 309 deferred. Remaining executive back-edges need OffsetBrep over original/offset Brep ids and the unported continuation at cpp:2956-3071 (topology.brep_p7/p8). CO-PORTED: SsiData<O> (SmSSIData). Adjacent changes: nurbs.b_spline_surface_p2 create_sphere_from_arcs (WR-103 reproduced, arcs as Curve), offset.offset_executive_p1 insert_extended_surface. 15 fns; largest: EdgeuseOffset, TrimExtendedEdge, ExtendTrimEdges, MateEdges; cycle back-edge offset.offset_executive_p1(9); unit-SCC #26 (2 units); 11 upstream test entry points.  Owner zone-tol cache (surface/owner-zone-tol): 874 